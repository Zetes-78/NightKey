name: Build NightKey

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y

      # Website download: the per-user installer (runs the 119 core tests first).
      - name: Build the installer
        shell: pwsh
        run: ./build.ps1

      # Microsoft Store: the MSIX package. The identity comes from repository variables set from Partner Center.
      - name: Build the Microsoft Store package
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
        run: ./build-store.ps1

      # The website's button points at releases/latest/download/NightKey-Setup.exe, so keep that exact name too.
      - name: Name the download
        shell: pwsh
        run: |
          $v = (Select-Xml -Path src\NightKey\NightKey.csproj -XPath '//Version').Node.InnerText
          Copy-Item "dist\NightKey-Setup-$v.exe" dist\NightKey-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: NightKey-installer
          path: |
            dist/NightKey-Setup*.exe
            dist/NightKey-Setup*.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NightKey-Microsoft-Store
          path: dist/*.msix*

      # Only the website installer goes on the public release; the .msix is uploaded in Partner Center.
      - name: Attach the installer to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NightKey-Setup.exe
            dist/NightKey-Setup-*.exe.sha256.txt
